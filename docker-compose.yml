# Development stack. `make up` (or `docker compose up -d --build`) starts everything,
# runs migrations and seeds an empty database.
name: climatisation-maroc

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: climatisation-maroc/php:dev
  env_file: backend/.env
  environment: &php-env
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - ./backend:/var/www/backend
    # vendor/ lives in a volume: bind-mounted vendor is far too slow on Windows/macOS.
    - backend_vendor:/var/www/backend/vendor
    - ./data:/var/www/data:ro
    - ./design/uploads:/var/www/design-uploads:ro
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./backend/storage/app/public:/var/www/storage:ro
    depends_on: [php, next]
    restart: unless-stopped

  php:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: app
      APP_SEED: auto

  queue:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    depends_on: [php]

  scheduler:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan schedule:work
    depends_on: [php]

  next:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
      target: dev
    image: climatisation-maroc/next:dev
    environment:
      API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-8080}
      # Must match backend/.env REVALIDATE_SECRET (Laravel expires the front office cache).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - next_node_modules:/app/node_modules
      - ./design/uploads:/design-uploads:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-climatisation}
      MYSQL_USER: ${DB_USERNAME:-climatisation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["${DB_FORWARD_PORT:-33306}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_PORT:-8025}:8025"]

volumes:
  backend_vendor:
  mysql_data:
  redis_data:
  next_node_modules:
