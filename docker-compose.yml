# Development stack. `make up` (or `docker compose up -d --build`) starts everything,
# runs migrations and seeds an empty database.
name: climatisation-maroc

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: climatisation-maroc/php:dev
  env_file: backend/.env
  environment: &php-env
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    # Storefront URLs (config/sites.php); override backend/.env so arfro links point to the dev host.
    SITE_CM_URL: http://localhost:${APP_PORT:-8080}
    SITE_ARFRO_URL: http://arfro.localhost:${APP_PORT:-8080}
    SITE_ARFRO_INTERNAL_URL: http://next-arfro:3000
  volumes:
    - ./backend:/var/www/backend
    # vendor/ lives in a volume: bind-mounted vendor is far too slow on Windows/macOS.
    - backend_vendor:/var/www/backend/vendor
    - ./data:/var/www/data:ro
    - ./design/uploads:/var/www/design-uploads:ro
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./backend/storage/app/public:/var/www/storage:ro
    # next-arfro is not a dependency: nginx resolves it per request, so the stack runs without it.
    depends_on: [php, next]
    restart: unless-stopped

  php:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: app
      APP_SEED: auto

  queue:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    depends_on: [php]

  scheduler:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan schedule:work
    depends_on: [php]

  # Two storefronts, one Next.js code base (docs/architecture.md, Multi-site): `next` serves
  # Climatisation Maroc (http://localhost:8080), `next-arfro` serves Arfro
  # (http://arfro.localhost:8080; browsers resolve *.localhost to 127.0.0.1). nginx picks one by Host.
  next:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
      target: dev
    image: climatisation-maroc/next:dev
    environment: &next-env
      API_INTERNAL_URL: http://nginx
      SITE_KEY: cm
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-8080}
      SITE_URL: http://localhost:${APP_PORT:-8080}
      # Must match backend/.env REVALIDATE_SECRET (Laravel expires the front office cache).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - next_node_modules:/app/node_modules
      - ./design/uploads:/design-uploads:ro
    restart: unless-stopped

  # Second dev server on the same sources. Its build output lives in its own volume so the two
  # servers never overwrite each other's .next. It waits for `next` to finish installing the shared
  # node_modules. A second `next dev` costs about 1 GB of RAM: `docker compose stop next-arfro`
  # when you do not work on Arfro (arfro.localhost then answers 502, localhost is unaffected).
  next-arfro:
    image: climatisation-maroc/next:dev
    pull_policy: never
    environment:
      <<: *next-env
      SITE_KEY: arfro
      NEXT_PUBLIC_SITE_URL: http://arfro.localhost:${APP_PORT:-8080}
      SITE_URL: http://arfro.localhost:${APP_PORT:-8080}
    command: ["sh", "-c", "until [ -f node_modules/.package-lock.json ]; do echo 'waiting for node_modules (installed by next)'; sleep 5; done; npm run dev:docker"]
    volumes:
      - ./frontend:/app
      - next_node_modules:/app/node_modules
      - next_arfro_build:/app/.next
      - ./design/uploads:/design-uploads:ro
    depends_on: [next]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-climatisation}
      MYSQL_USER: ${DB_USERNAME:-climatisation}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["${DB_FORWARD_PORT:-33306}:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_PORT:-8025}:8025"]

volumes:
  backend_vendor:
  mysql_data:
  redis_data:
  next_node_modules:
  next_arfro_build:
