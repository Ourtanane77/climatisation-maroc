# Single entry point, used by the dev stack (bind-mounted) and baked into the prod nginx image:
#   Laravel  -> /api/v1, /admin (Filament), /livewire* (Livewire 4 uses a hashed prefix), /sanctum, /storage, Filament assets, /up
#   (/api/* outside v1 belongs to Next.js route handlers: auth, forms, revalidation)
#   Next.js  -> everything else (front office)
# In production a TLS terminator (host nginx, Caddy, load balancer) sits in front and sends
# X-Forwarded-For / X-Forwarded-Proto; see docs/deployment.md.

upstream php_upstream  { server php:9000; }
upstream next_upstream { server next:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Back office, Livewire and API responses are never indexed (empty value = no header).
map $request_uri $robots_header {
    default                          "";
    ~^/(admin|livewire[^/]*|api)(/|$) "noindex, nofollow";
}

# Scheme seen by the visitor: the TLS terminator's X-Forwarded-Proto when present.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# HSTS only when the visitor came over HTTPS (empty value = header not sent, e.g. in dev).
map $forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Uploads: back-office images, quote attachments (10 MB) + form overhead (php.ini post_max_size 14M).
    client_max_body_size 14m;

    root /var/www/backend/public;

    # Visitor IP from the TLS terminator / Docker network (private ranges only), for logs and rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/xml
               application/manifest+json image/svg+xml image/x-icon text/plain;

    # Security headers. nginx drops server-level add_header in any location that sets its own,
    # so the locations below that add headers repeat these lines.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Hidden files (.env, .git…) are never served; ACME challenges stay reachable.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # Laravel public files (uploads, Filament assets).
    # storage/app/public is mounted at /var/www/storage (no public/storage symlink needed).
    # Product/content files never change in place (uploads get new names, renditions carry the
    # source name + width): cached for a year. Brand logos keep fixed names (lg.png): one week.
    location ^~ /storage/brands/ {
        alias /var/www/storage/brands/;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }
    location ^~ /storage/ {
        alias /var/www/storage/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security $hsts_header always;
    }
    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        expires 7d;
    }

    # Laravel routes.
    location ~ ^/(api/v1|admin|livewire[^/]*|sanctum|filament|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts_header always;
    }

    # Only index.php runs PHP: any other .php path is a 404.
    location ~ \.php$ { return 404; }

    # Front office (Next.js).
    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
