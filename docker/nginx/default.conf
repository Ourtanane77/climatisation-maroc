# Single entry point:
#   Laravel  -> /api/v1, /admin (Filament), /livewire* (Livewire 4 uses a hashed prefix), /sanctum, /storage, Filament assets, /up
#   (/api/* outside v1 belongs to Next.js route handlers: auth, forms, revalidation)
#   Next.js  -> everything else (front office)

upstream php_upstream  { server php:9000; }
upstream next_upstream { server next:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Back office, Livewire and API responses are never indexed (empty value = no header).
map $request_uri $robots_header {
    default                          "";
    ~^/(admin|livewire[^/]*|api)(/|$) "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 14m;

    root /var/www/backend/public;

    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/xml
               application/manifest+json image/svg+xml image/x-icon text/plain;

    # Laravel public files (uploads, Filament assets).
    # storage/app/public is mounted at /var/www/storage (no public/storage symlink needed).
    # Product/content files never change in place (uploads get new names, renditions carry the
    # source name + width): cached for a year. Brand logos keep fixed names (lg.png): one week.
    location ^~ /storage/brands/ {
        alias /var/www/storage/brands/;
        add_header Cache-Control "public, max-age=604800";
    }
    location ^~ /storage/ {
        alias /var/www/storage/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        expires 7d;
    }

    # Laravel routes.
    location ~ ^/(api/v1|admin|livewire[^/]*|sanctum|filament|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        add_header X-Robots-Tag $robots_header always;
    }

    location ~ \.php$ { return 404; }

    # Front office (Next.js).
    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
