# Single entry point:
#   Laravel  -> /api/v1, /admin (Filament), /livewire, /sanctum, /storage, Filament assets, /up
#   (/api/* outside v1 belongs to Next.js route handlers: auth, forms, revalidation)
#   Next.js  -> everything else (front office)

upstream php_upstream  { server php:9000; }
upstream next_upstream { server next:3000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 14m;

    root /var/www/backend/public;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Laravel public files (uploads, Filament assets).
    # storage/app/public is mounted at /var/www/storage (no public/storage symlink needed).
    location ^~ /storage/ {
        alias /var/www/storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~ ^/(css|js|fonts)/filament/ {
        try_files $uri =404;
        expires 7d;
    }

    # Laravel routes.
    location ~ ^/(api/v1|admin|livewire|sanctum|filament|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }

    # Front office (Next.js).
    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
