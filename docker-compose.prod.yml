# Production stack: images are built from the repo, nothing is bind-mounted.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Put a TLS terminator (host nginx, Caddy or a load balancer) in front of port APP_PORT.
name: climatisation-maroc-prod

# php, queue and scheduler share one image; only the php service builds it.
x-php: &php
  image: climatisation-maroc/php:prod
  pull_policy: never
  env_file: .env.prod
  environment: &php-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    REDIS_HOST: redis
  volumes:
    - storage:/var/www/backend/storage/app/public
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: always

services:
  php:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    pull_policy: build
    environment:
      <<: *php-env
      APP_ROLE: app
      APP_SEED: auto
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 30s

  queue:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    depends_on: [php]

  scheduler:
    <<: *php
    environment:
      <<: *php-env
      APP_ROLE: worker
    command: php artisan schedule:work
    depends_on: [php]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:php
    image: climatisation-maroc/nginx:prod
    ports: ["${APP_PORT:-80}:80"]
    volumes:
      - storage:/var/www/storage:ro
    depends_on: [php, next]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 30s

  next:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
      target: prod
      args:
        API_INTERNAL_URL: http://nginx
        NEXT_PUBLIC_SITE_URL: ${APP_URL:-https://climatisationmaroc.com}
    image: climatisation-maroc/next:prod
    environment:
      API_INTERNAL_URL: http://nginx
      NEXT_PUBLIC_SITE_URL: ${APP_URL:-https://climatisationmaroc.com}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s

  mysql:
    image: mysql:8.4
    env_file: .env.prod
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql_data:/var/lib/mysql]
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

volumes:
  mysql_data:
  redis_data:
  storage:
