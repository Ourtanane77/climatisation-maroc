# Continuous integration: backend (Pest, Pint, Larastan) and frontend (ESLint, types, Vitest,
# production build) on every push and pull request. The full-stack job (Docker stack, nginx smoke
# test, Playwright end-to-end tests) is heavier and runs only when started by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stack:
        description: "Also run the Docker stack, smoke test and end-to-end tests"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: climatisation_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # phpunit.xml forces the test database name, cache, queue, session and mail drivers.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, intl, zip, gd, bcmath, exif, pcntl, redis
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest
        run: php artisan test --compact

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Pages render per request (root layout): the build never calls the API.
      API_INTERNAL_URL: http://localhost:8080
      NEXT_PUBLIC_SITE_URL: https://app.arfro.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Prettier
        run: npx prettier --check src

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  stack:
    name: Docker stack, smoke and end-to-end tests
    if: github.event_name == 'workflow_dispatch' && inputs.stack
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start the development stack (migrates and seeds)
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose up -d --build
          docker compose exec -T php php artisan key:generate --force
          for _ in $(seq 1 90); do
            curl -fsS -o /dev/null http://localhost:8080/api/health && curl -fsS -o /dev/null http://localhost:8080/api/v1/health && break
            sleep 10
          done

      - name: Smoke test through nginx
        run: node scripts/smoke.mjs http://localhost:8080

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: End-to-end tests
        working-directory: frontend
        env:
          E2E_RESELLER_PASSWORD: change-me-reseller
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Stack logs
        if: failure()
        run: docker compose logs --tail=200
